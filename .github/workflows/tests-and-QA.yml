name: tests-and-QA

on:
  push: ~

concurrency:
  group: tests-and-QA_${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    env:
      COMPOSE_ENV_FILES: .env.test
    steps:
      - uses: actions/checkout@v7

      - run: make build
      - run: make test
